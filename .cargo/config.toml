[build]
target = "thumbv7em-none-eabihf"

# `build.target` above forces the embedded triple onto every cargo command, so a
# plain `cargo test` tries to build the test harness for bare-metal and fails
# with E0463 (no `test` crate). The logic crate's tests are HOST tests — run them
# with the wrapper scripts, which auto-detect the host triple:
#   Windows:      .\test.ps1
#   macOS/Linux:  ./test.sh

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F407VETx"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "debug"
