  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // which transformScriptTags handles unconditionally.

        s.textContent = await r.text();

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

sparent 1px);\n    background-size:var(--grid-px) var(--grid-px);\n    mask-image:radial-gradient(120% 80% at 50% 40%, black 30%, transparent 75%);\n    opacity:.5;\n    z-index:1;\n  }\n\n  /* ============ TOP STATUS BAR ============ */\n  .topbar{\n    position:relative; z-index:10;\n    display:grid; grid-template-columns: 1fr auto 1fr;\n    align-items:center; gap:24px;\n    padding:14px 28px;\n    border-bottom:1px solid var(--line);\n    font-size:11px; letter-spacing:.18em; text-transform:uppercase;\n    color:var(--dim);\n    background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);\n    backdrop-filter:blur(2px);\n  }\n  .topbar .left, .topbar .right{display:flex; gap:22px; align-items:center}\n  .topbar .right{justify-content:flex-end}\n  .topbar .brand{\n    color:var(--ink); font-weight:700; letter-spacing:.3em;\n    display:flex; align-items:center; gap:10px;\n  }\n  .topbar .brand::before{\n    content:\"\"; width:8px; height:8px; background:var(--cyan);\n    box-shadow:0 0 12px var(--cyan), 0 0 24px var(--cyan);\n    border-radius:50%;\n    animation:pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes pulse{\n    0%,100%{opacity:1; transform:scale(1)}\n    50%{opacity:.45; transform:scale(.8)}\n  }\n  .topbar .dot{width:5px;height:5px;background:var(--dimmer);border-radius:50%;display:inline-block;margin:0 2px 1px}\n  .topbar .ok{color:var(--green)}\n  .topbar .hot{color:var(--magenta)}\n\n  /* ============ LAYOUT ============ */\n  main{position:relative; z-index:5}\n  .hero{\n    position:relative;\n    padding:60px 28px 0;\n    min-height:calc(100vh - 48px);\n    display:grid;\n    grid-template-columns: 1.05fr 1fr;\n    gap:48px;\n    align-items:center;\n  }\n\n  /* Section corner brackets */\n  .bracketed{position:relative}\n  .bracketed::before,.bracketed::after,\n  .bracketed > .bk1,.bracketed > .bk2{\n    content:\"\"; position:absolute; width:14px; height:14px;\n    border:1px solid var(--cyan); opacity:.7;\n  }\n  .bracketed::before{top:-1px;left:-1px;border-right:none;border-bottom:none}\n  .bracketed::after{top:-1px;right:-1px;border-left:none;border-bottom:none}\n  .bracketed > .bk1{bottom:-1px;left:-1px;border-right:none;border-top:none}\n  .bracketed > .bk2{bottom:-1px;right:-1px;border-left:none;border-top:none}\n\n  /* ============ HERO LEFT ============ */\n  .eyebrow{\n    display:inline-flex; align-items:center; gap:10px;\n    font-size:11px; letter-spacing:.32em; text-transform:uppercase;\n    color:var(--magenta);\n    padding:6px 10px;\n    border:1px solid rgba(255,43,214,.45);\n    background:linear-gradient(180deg, rgba(255,43,214,.08), rgba(255,43,214,0));\n    margin-bottom:32px;\n  }\n  .eyebrow::before{\n    content:\"\"; width:6px;height:6px; background:var(--magenta);\n    box-shadow:0 0 10px var(--magenta);\n  }\n\n  h1.title{\n    font-family:'JetBrains Mono', monospace;\n    font-weight:800;\n    font-size:clamp(64px, 9.2vw, 156px);\n    line-height:.86;\n    letter-spacing:-.04em;\n    margin:0 0 18px;\n    color:var(--ink);\n    text-shadow:\n      0 0 24px rgba(0,231,255,.18),\n      0 0 80px rgba(0,231,255,.08);\n    position:relative;\n  }\n  h1.title .accent{\n    color:transparent;\n    -webkit-text-stroke:1.5px var(--cyan);\n    text-stroke:1.5px var(--cyan);\n    text-shadow:0 0 24px rgba(0,231,255,.45);\n  }\n  h1.title .slash{color:var(--magenta);text-shadow:0 0 22px rgba(255,43,214,.6)}\n  h1.title::after{\n    content:\"_\";\n    color:var(--cyan);\n    margin-left:-.05em;\n    animation:blink 1.05s steps(2,end) infinite;\n    text-shadow:0 0 22px rgba(0,231,255,.7);\n  }\n  @keyframes blink{0%,55%{opacity:1}55.01%,100%{opacity:0}}\n\n  .lede{\n    max-width:560px;\n    font-size:14px; line-height:1.7;\n    color:var(--dim);\n    letter-spacing:.02em;\n    margin:0 0 36px;\n  }\n  .lede strong{color:var(--ink);font-weight:500}\n  .lede .pink{color:var(--magenta-2);font-weight:500}\n\n  /* spec grid */\n  .specs{\n    display:grid; grid-template-columns:repeat(4, 1fr); gap:0;\n    border-top:1px solid var(--line);\n    border-bottom:1px solid var(--line);\n    margin-bottom:38px;\n  }\n  .spec{\n    padding:18px 18px 16px 0;\n    border-right:1px solid var(--line);\n    position:relative;\n  }\n  .spec:last-child{border-right:none}\n  .spec .k{\n    font-size:10px; letter-spacing:.24em; color:var(--dim); text-transform:uppercase;\n    margin-bottom:10px; display:flex; align-items:center; gap:6px;\n  }\n  .spec .k::before{content:\"//\"; color:var(--dimmer)}\n  .spec .v{\n    font-size:28px; font-weight:700; letter-spacing:-.02em;\n    color:var(--ink);\n    line-height:1;\n  }\n  .spec .u{font-size:13px; color:var(--cyan); margin-left:4px; font-weight:400}\n  .spec .sub{font-size:10px; color:var(--dimmer); letter-spacing:.2em; text-transform:uppercase; margin-top:8px}\n\n  .cta-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}\n  .btn{\n    --c:var(--cyan);\n    appearance:none; cursor:pointer; text-decoration:none;\n    font-family:inherit; font-size:12px; font-weight:600;\n    letter-spacing:.24em; text-transform:uppercase;\n    padding:14px 22px;\n    background:transparent; color:var(--c);\n    border:1px solid var(--c);\n    position:relative;\n    transition:all .2s ease;\n    display:inline-flex; align-items:center; gap:10px;\n  }\n  .btn::before, .btn::after{\n    content:\"\"; position:absolute; width:8px; height:8px;\n    border:1px solid var(--c);\n  }\n  .btn::before{top:-1px;left:-1px;border-right:none;border-bottom:none}\n  .btn::after{bottom:-1px;right:-1px;border-left:none;border-top:none}\n  .btn:hover{\n    background:color-mix(in oklab, var(--c) 12%, transparent);\n    box-shadow:0 0 20px color-mix(in oklab, var(--c) 35%, transparent), inset 0 0 18px color-mix(in oklab, var(--c) 12%, transparent);\n  }\n  .btn.primary{\n    --c:var(--magenta);\n    background:linear-gradient(180deg, rgba(255,43,214,.16), rgba(255,43,214,.04));\n    color:#fff;\n    box-shadow:0 0 22px rgba(255,43,214,.25), inset 0 0 30px rgba(255,43,214,.12);\n  }\n  .btn .arr{color:inherit}\n  .btn-small-meta{font-size:10px; color:var(--dim); letter-spacing:.24em; text-transform:uppercase; margin-left:8px}\n\n  /* ============ HERO RIGHT: CHIP ============ */\n  .chip-wrap{\n    position:relative;\n    aspect-ratio: 1/1;\n    width:100%;\n    max-width:640px;\n    margin-left:auto;\n  }\n  .chip-svg{width:100%; height:100%; display:block}\n\n  /* trace flow animation via stroke-dashoffset */\n  @keyframes flow{to{stroke-dashoffset:-200}}\n  @keyframes flow-rev{to{stroke-dashoffset:200}}\n  @keyframes blink-pad{\n    0%,100%{opacity:1; filter:drop-shadow(0 0 6px currentColor)}\n    50%{opacity:.35; filter:drop-shadow(0 0 2px currentColor)}\n  }\n  @keyframes ring-rot{to{transform:rotate(360deg)}}\n  @keyframes float-y{\n    0%,100%{transform:translateY(0)}\n    50%{transform:translateY(-6px)}\n  }\n\n  .chip-svg .trace{\n    fill:none;\n    stroke-width:1.2;\n    stroke-linecap:square;\n  }\n  .chip-svg .trace-c{stroke:var(--cyan); filter:drop-shadow(0 0 4px var(--cyan))}\n  .chip-svg .trace-m{stroke:var(--magenta); filter:drop-shadow(0 0 4px var(--magenta))}\n  .chip-svg .trace-v{stroke:var(--violet); filter:drop-shadow(0 0 4px var(--violet))}\n  .chip-svg .trace-dim{stroke:var(--line-hot); stroke-width:1}\n\n  .chip-svg .flow{\n    stroke-dasharray:14 18;\n    animation:flow 2.6s linear infinite;\n  }\n  .chip-svg .flow-slow{\n    stroke-dasharray:6 22;\n    animation:flow 5s linear infinite;\n  }\n  .chip-svg .flow-rev{\n    stroke-dasharray:10 14;\n    animation:flow-rev 3.4s linear infinite;\n  }\n\n  .chip-svg .pad{fill:var(--cyan); opacity:.9}\n  .chip-svg .pad-m{fill:var(--magenta)}\n  .chip-svg .blink{animation:blink-pad 1.6s ease-in-out infinite}\n  .chip-svg .blink-2{animation:blink-pad 2.2s ease-in-out infinite .4s}\n  .chip-svg .blink-3{animation:blink-pad 1.2s ease-in-out infinite .8s}\n\n  .chip-svg .die-label{\n    font-family:'JetBrains Mono', monospace;\n    font-size:7px;\n    letter-spacing:.18em;\n    fill:var(--cyan);\n    text-transform:uppercase;\n    opacity:.85;\n  }\n  .chip-svg .die-sub{\n    font-size:5px; fill:var(--dim); letter-spacing:.2em;\n  }\n  .chip-svg .corner-num{\n    font-size:5px; fill:var(--dimmer); letter-spacing:.2em;\n  }\n\n  /* HUD callouts around chip */\n  .callout{\n    position:absolute;\n    font-size:10px; letter-spacing:.22em; text-transform:uppercase;\n    color:var(--dim);\n    display:flex; align-items:center; gap:8px;\n    white-space:nowrap;\n  }\n  .callout .pill{\n    border:1px solid var(--line-hot);\n    padding:5px 10px;\n    color:var(--ink);\n    background:rgba(0,231,255,.05);\n    box-shadow:inset 0 0 12px rgba(0,231,255,.08);\n  }\n  .callout .pill.m{\n    border-color:rgba(255,43,214,.4); background:rgba(255,43,214,.05);\n    box-shadow:inset 0 0 12px rgba(255,43,214,.08);\n  }\n  .callout .num{color:var(--cyan)}\n\n  .c-tl{top:6%; left:-2%}\n  .c-tr{top:11%; right:-2%; text-align:right}\n  .c-br{bottom:14%; right:-2%; text-align:right}\n  .c-bl{bottom:8%; left:-2%}\n\n  /* Orbit ring */\n  .orbit{\n    position:absolute; inset:6%;\n    border:1px dashed rgba(0,231,255,.18);\n    border-radius:50%;\n    animation:ring-rot 60s linear infinite;\n    pointer-events:none;\n  }\n  .orbit::before{\n    content:\"\"; position:absolute; top:-4px; left:50%;\n    width:7px; height:7px; background:var(--cyan);\n    box-shadow:0 0 10px var(--cyan);\n    transform:translateX(-50%);\n  }\n\n  /* ============ TICKER ============ */\n  .ticker{\n    position:relative; z-index:6;\n    border-top:1px solid var(--line);\n    border-bottom:1px solid var(--line);\n    background:linear-gradient(180deg, rgba(0,231,255,.04), rgba(255,43,214,.04));\n    overflow:hidden;\n    margin-top:42px;\n  }\n  .ticker-track{\n    display:flex; gap:48px;\n    padding:14px 0;\n    white-space:nowrap;\n    animation: tick 38s linear infinite;\n    font-size:11px; letter-spacing:.28em; text-transform:uppercase;\n    color:var(--dim);\n  }\n  .ticker-track span b{color:var(--cyan); font-weight:500}\n  .ticker-track span .m{color:var(--magenta)}\n  .ticker-track span::after{content:\"  ◇  \"; color:var(--dimmer); margin-left:48px}\n  @keyframes tick{to{transform:translateX(-50%)}}\n\n  /* ============ CODE SECTION ============ */\n  .code-section{\n    position:relative; z-index:5;\n    padding:120px 28px 80px;\n    display:grid;\n    grid-template-columns: 360px 1fr;\n    gap:56px;\n    align-items:start;\n  }\n  .section-num{\n    font-size:11px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase;\n    margin-bottom:24px;\n    display:flex; align-items:center; gap:12px;\n  }\n  .section-num .bar{flex:1; height:1px; background:linear-gradient(to right, var(--line-hot), transparent)}\n  .section-num .magenta{color:var(--magenta)}\n  .code-section h2{\n    font-family:'JetBrains Mono', monospace;\n    font-weight:800; font-size:42px; line-height:1; letter-spacing:-.03em;\n    margin:0 0 22px; color:var(--ink);\n  }\n  .code-section h2 .ghost{\n    color:transparent; -webkit-text-stroke:1px var(--magenta);\n    text-shadow:0 0 18px rgba(255,43,214,.4);\n  }\n  .code-section .copy{\n    font-size:13px; line-height:1.7; color:var(--dim); max-width:340px;\n    margin-bottom:30px;\n  }\n  .annot{\n    border-left:1px solid var(--line-hot);\n    padding:10px 0 10px 14px;\n    margin-bottom:14px;\n  }\n  .annot .h{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--cyan); margin-bottom:6px}\n  .annot .h.m{color:var(--magenta)}\n  .annot .b{font-size:12px; color:var(--ink); line-height:1.55}\n\n  /* code window */\n  .code-win{\n    position:relative;\n    border:1px solid var(--line-hot);\n    background:\n      linear-gradient(180deg, rgba(0,231,255,.04), rgba(0,0,0,0) 40%),\n      var(--bg-2);\n    box-shadow:\n      0 0 0 1px rgba(0,231,255,.06),\n      0 30px 80px rgba(0,0,0,.55),\n      inset 0 0 60px rgba(0,231,255,.03);\n  }\n  .code-win::before, .code-win::after,\n  .code-win > .bk1, .code-win > .bk2{\n    content:\"\"; position:absolute; width:10px; height:10px;\n    border:1px solid var(--cyan);\n  }\n  .code-win::before{top:-1px;left:-1px;border-right:none;border-bottom:none}\n  .code-win::after{top:-1px;right:-1px;border-left:none;border-bottom:none}\n  .code-win > .bk1{bottom:-1px;left:-1px;border-right:none;border-top:none}\n  .code-win > .bk2{bottom:-1px;right:-1px;border-left:none;border-top:none}\n\n  .code-chrome{\n    display:flex; align-items:center; justify-content:space-between;\n    padding:12px 18px;\n    border-bottom:1px solid var(--line);\n    font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);\n    background:rgba(0,0,0,.35);\n  }\n  .code-chrome .path{color:var(--ink)}\n  .code-chrome .path .slash{color:var(--magenta)}\n  .code-chrome .meta{display:flex; gap:18px; align-items:center}\n  .code-chrome .meta .ok{color:var(--green)}\n  .lights{display:inline-flex; gap:6px; margin-right:14px}\n  .lights i{display:inline-block; width:9px; height:9px; border:1px solid var(--line-hot)}\n  .lights i:nth-child(1){background:rgba(255,43,214,.55);border-color:rgba(255,43,214,.7); box-shadow:0 0 8px rgba(255,43,214,.6)}\n  .lights i:nth-child(2){background:rgba(255,182,72,.55);border-color:rgba(255,182,72,.7)}\n  .lights i:nth-child(3){background:rgba(54,255,178,.55);border-color:rgba(54,255,178,.7); box-shadow:0 0 8px rgba(54,255,178,.4)}\n\n  .code-body{\n    display:grid; grid-template-columns: 48px 1fr;\n    font-family:'JetBrains Mono', monospace;\n    font-size:13.5px; line-height:1.7;\n    padding:18px 0;\n  }\n  .gutter{\n    text-align:right; padding-right:14px;\n    border-right:1px solid var(--line);\n    color:var(--dimmer);\n    user-select:none;\n    font-variant-numeric:tabular-nums;\n  }\n  .gutter span{display:block}\n  .code{\n    padding:0 22px;\n    white-space:pre;\n    overflow-x:auto;\n    color:var(--ink);\n  }\n  .code .kw{color:var(--magenta)}\n  .code .ty{color:var(--cyan-soft)}\n  .code .fn{color:var(--cyan)}\n  .code .num{color:var(--amber)}\n  .code .str{color:var(--green)}\n  .code .com{color:var(--dimmer); font-style:italic}\n  .code .pre{color:var(--violet)}\n  .code .sym{color:var(--dim)}\n  .code .hi{\n    background:linear-gradient(90deg, rgba(255,43,214,.10), transparent 60%);\n    box-shadow: inset 2px 0 0 var(--magenta);\n    display:inline-block; width:100%;\n  }\n\n  .code-foot{\n    display:flex; justify-content:space-between; align-items:center;\n    padding:10px 18px;\n    border-top:1px solid var(--line);\n    font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim);\n    background:rgba(0,0,0,.35);\n  }\n  .code-foot .seg{display:flex; gap:18px; align-items:center}\n  .code-foot .ok{color:var(--green)}\n  .code-foot .cy{color:var(--cyan)}\n\n  /* ============ FOOTER ============ */\n  footer{\n    position:relative; z-index:5;\n    border-top:1px solid var(--line);\n    padding:28px 28px;\n    display:flex; justify-content:space-between; align-items:center;\n    font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim);\n  }\n  footer .mark{color:var(--ink); letter-spacing:.32em}\n  footer .mark span{color:var(--cyan)}\n\n  /* ============ MEDIA ============ */\n  @media (max-width: 1100px){\n    .hero{grid-template-columns:1fr; min-height:auto; padding-top:32px}\n    .chip-wrap{margin:8px auto 0}\n    .code-section{grid-template-columns:1fr; padding:80px 24px 60px}\n    .specs{grid-template-columns:repeat(2, 1fr)}\n    .spec:nth-child(2){border-right:none}\n    .topbar{grid-template-columns:1fr auto; font-size:10px}\n    .topbar .right{display:none}\n  }\n  @media (max-width: 640px){\n    .specs{grid-template-columns:1fr}\n    .spec{border-right:none; border-bottom:1px solid var(--line)}\n    .spec:last-child{border-bottom:none}\n    .topbar .left{flex-wrap:wrap; gap:10px}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"gridlines\"><\u002Fdiv>\n<div class=\"scanlines\"><\u002Fdiv>\n<div class=\"grain\"><\u002Fdiv>\n<div class=\"vignette\"><\u002Fdiv>\n\n<!-- ================= TOP BAR ================= -->\n<div class=\"topbar\">\n  <div class=\"left\">\n    <span class=\"brand\">STM32 // SIGNAL.EDGE<\u002Fspan>\n    <span>SEC ▸ 47.6N · 122.3W<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"brand\" style=\"font-size:10px;letter-spacing:.4em\">— REV 04.26 —<\u002Fdiv>\n  <div class=\"right\">\n    <span>UPLINK <span class=\"ok\">●<\u002Fspan> NOMINAL<\u002Fspan>\n    <span>BUS <span class=\"hot\">●<\u002Fspan> 480MHZ<\u002Fspan>\n    <span>23:47:08 <span class=\"dot\"><\u002Fspan> JST<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main>\n\n<!-- ================= HERO ================= -->\n<section class=\"hero\">\n\n  <!-- LEFT -->\n  <div class=\"hero-left\">\n    <span class=\"eyebrow\">Arm® Cortex®-M // 32-bit MCU family<\u002Fspan>\n\n    <h1 class=\"title\">SIGNAL<br><span class=\"accent\">AT THE<\u002Fspan><span class=\"slash\">/<\u002Fspan>EDGE<\u002Fh1>\n\n    <p class=\"lede\">\n      A 32-bit microcontroller family engineered for the things that live between the city and the network. <strong>Real-time control<\u002Fstrong>, deterministic interrupt latency, and a peripheral ecosystem that handles the noise so your firmware doesn't have to. From a <span class=\"pink\">battery-shaped sensor<\u002Fspan> on a transit pole to a robot arm in a sub-basement — <strong>one silicon line, one toolchain, one signal path<\u002Fstrong>.\n    <\u002Fp>\n\n    <div class=\"specs bracketed\">\n      <span class=\"bk1\"><\u002Fspan><span class=\"bk2\"><\u002Fspan>\n      <div class=\"spec\">\n        <div class=\"k\">core<\u002Fdiv>\n        <div class=\"v\">M7<span class=\"u\">@480<\u002Fspan><\u002Fdiv>\n        <div class=\"sub\">Cortex-M0+ → M7<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"spec\">\n        <div class=\"k\">flash<\u002Fdiv>\n        <div class=\"v\">2.0<span class=\"u\"
